<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand text-white fs-3 fw-bold d-flex align-items-center gap-2">
            <i class="fa-solid fa-cloud-sun brand-icon"></i>
            <span>Weather<span class="brand-accent">App</span></span>
        </a>

        <form class="d-flex search-box position-relative">

            <input
                id="searchInput"
                class="form-control me-2 custom-input"
                type="search"
                placeholder="Search city..."
                autocomplete="off">

            <button
                id="searchBtn"
                class="btn custom-btn d-flex align-items-center justify-content-center gap-2">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Search</span>
            </button>

        </form>

    </div>
</nav>

    <!-- Weather Card -->
    <section class="mt-5">

        <div class="container">

            <div class="weather-card">

                <div class="row align-items-center">

                    <!-- Left -->
                    <div class="col-md-6">

                        <h1 id="city">
                            Cairo
                        </h1>

                        <p id="date">
                            Date
                        </p>

                        <h2 id="temp">
                            00°C
                        </h2>

                        <p id="condition">
                            Clear
                        </p>

                        <div class="weather-details">

                            <p id="feel">
                                <i class="fas fa-temperature-half"></i>
                            </p>

                            <p id="humidity">
                                <i class="fas fa-droplet"></i>
                            </p>

                            <p id="wind">
                                <i class="fas fa-wind"></i>
                            </p>

                        </div>

                    </div>

                    <!-- Right -->
                    <div class="col-md-6 text-center">

                        <i id="icon" class="fa-solid fa-sun"></i>

                    </div>

                </div>

            </div>

        </div>

    </section>

</main>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>

</body>
</html>
